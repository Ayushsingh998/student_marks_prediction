<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Marks Prediction</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Student Marks Prediction</h1>
    <form id="student-form">
      <input type="text" name="name" placeholder="Name" required />
      <input type="number" name="age" placeholder="Age" required />
      <input type="number" step="0.1" name="hours_studied" placeholder="Hours Studied" required />
      <input type="number" step="0.1" name="attendance" placeholder="Attendance %" required />
      <input type="number" step="0.1" name="assignment_score" placeholder="Assignment Score" required />
      <input type="number" step="0.1" name="previous_marks" placeholder="Previous Marks" required />
      <button type="submit">Predict</button>
    </form>
    <script src="js/api.js"></script>
    <script src="js/form.js"></script>
  </body>
</html>
